performance:
  thresholds_status: "Проектные критерии, не измеренные характеристики сервиса. Уточнить на staging baseline до реализации волны, зафиксировать до сравнения кандидата."
  measurement:
    - "Отдельно source wall time, queue_wait, HTTP time, parse time, cache read/write, merge, XLSX import/export."
    - "p50/p95/p99, timeout/error/partial доли, число внешних запросов, байты, RSS, event-loop lag, очередь."
    - "Один и тот же стенд, ресурсы, fixtures, concurrency и seed; baseline/candidate чередовать минимум 3 раза."
    - "Не считать быстрые ошибочные/пустые ответы улучшением скорости; качество сравнивать одновременно."
    - "Чистый кэш, прогретый кэш, истёкший кэш, смесь 80/20 и одновременный одинаковый номер отдельно."
  simulated_matrix:
    batch_rows: [1, 10, 100, 1000]
    concurrent_clients: [1, 4, 10, 20]
    fixture_sizes: [small, typical, largest_observed, synthetic_over_limit]
    delays: [fast, typical, one_slow_source, all_timeouts]
    minimum_samples_for_p95: 100
    minimum_samples_for_p99: 1000
    stress_scope: "1000 строк × 20 клиентов только на mock-источниках с ограничением ресурсов; никогда не live."
  initial_gates:
    existing_source_p95_regression_percent_max: 10
    cached_lookup_p95_ms_target: 500
    pure_parse_p95_ms_target: 100
    typical_fixture_size_kib_for_parse_target_max: 1024
    candidate_rss_growth_vs_baseline_percent_max: 20
    offline_event_loop_lag_p95_ms_target: 100
    live_http_source_p95_seconds_target: 15
    live_browser_source_p95_seconds_target: 30
    slow_source_rule: "Источник вне бюджета не включать в синхронный общий путь; отдельный разбор компромисса, не увеличение таймаута всем."
    memory_rule: "После повторных прогонов RSS не растёт монотонно; для браузера отдельно холодный старт/закрытые контексты."
  request_budget_examples:
    brixo_nibkru: "1 search + не более max_products_per_oe info; общий домен учитывать суммарно."
    brembo: "home + search + list + до 2 * max_products_per_oe refs; каждый redirect/retry считать отдельно."
    kyb: "1 POST cross без необоснованных повторов."
    other_sources: "Бюджет устанавливается после discovery; обязательное конечное ограничение страниц, карточек и retry."
  live_probe_policy:
    concurrency_per_upstream: 1
    minimum_interval_seconds_between_requests: 3
    max_http_requests_per_upstream_per_session: 100
    obey_stricter_source_limits: true
    on_429_or_challenge: stop_and_record
    rule: "Начать с 2 positive+2 negative; расширять набор несколькими сессиями. Малую выборку не выдавать за достоверный p99."

release_gates:
  G0: "Изоляция доказана: ни одного prod DSN/секрета/записи/внешнего вызова в offline прогоне."
  G1: "Каждой строке Excel соответствует источник/группа и решение; доступ и контракт подтверждены."
  G2: "На reviewed golden: precision=1.0, recall=1.0 для заявленной полной области, forbidden pairs=0; нет неподтверждённых кроссов."
  G3: "Все обязательные unit/replay/integration/browser/regression tests проходят; skip live в offline не означает готовность источника."
  G4: "Скорость, request budget, очередь и память в согласованных границах; сравнение baseline/candidate приложено."
  G5: "Свежая малая live-выборка из staging подтверждает endpoint/контракт; blocked источник в release не включён."
  G6: "Восстановление backup и rollback проверены на staging, новые источники выключены по умолчанию, pilot cohort реализована."
  G7: "Пользователь получил конкретный release report и отдельно поручил выпуск; без этого production не меняется."
  G8: "Pilot проверен по качеству и техническим метрикам, затем только согласованное расширение."
  scoring:
    precision: "Количество верных пар / всех возвращённых пар; пустой ответ на positive не получает perfect precision как обход gate."
    recall: "Количество найденных ожидаемых пар / всех ожидаемых пар в явно заданном полном scope."
    partial: "Допустим только явный неполный результат; нельзя убирать неудобные expected pairs, чтобы пройти gate."

release_procedure:
  delivery_unit: "Один источник + одна группа; shared transport changes — отдельный release с регрессией всех потребителей."
  steps:
    - "Зафиксировать commit, тестовый отчёт, diff настроек, список групп, новые обращения/сек и rollback artifact."
    - "Проверить CI и staging на release commit, отсутствие секретов и посторонних изменений."
    - "Подготовить совместимые по API/DB изменения. Миграции только additive; без массовой очистки кэша/истории."
    - "Перед согласованным выпуском сделать consistent backup SQLite штатным online backup API, не копированием только .db при WAL. Проверить restore на staging."
    - "Обеспечить одного владельца job queue: проверенный graceful drain/возобновление, ограниченная очередь и отсутствие повторного reserve."
    - "Не обещать zero downtime при текущем in-process JobRunner. Если безопасный handoff не готов — выпуск отложить, а не перезапускать под клиентским Excel."
    - "Развернуть выключенный источник; проверить прежние сценарии без изменения квот реальных клиентов."
    - "Включить source+group только выделенной тестовой cohort; не дублировать все клиентские запросы в shadow без бюджета."
    - "Наблюдать минимум рабочий день и собрать не менее 30 завершённых pilot поисков; при низком трафике продлить, не расширять по таймеру."
    - "Расширять детерминированной cohort, затем всем по этой группе, после каждого шага оценить gate. Не включать остальные группы автоматически."
  rollback_triggers:
    - "Любой подтверждённый ложный кросс, межклиентская утечка, потеря/дублирование задания или лишнее списание."
    - "Рост p95 существующего поиска более 10% на сопоставимой выборке минимум 100 запросов."
    - "Рост технических ошибок более 2 процентных пунктов в двух последовательных 15-минутных окнах с достаточной выборкой; малую выборку оценивать вручную."
    - "429/challenge всплеск, превышение upstream budget, неограниченный рост очереди/памяти."
  rollback:
    - "Отключить конкретный source+group; не выключать весь сервис."
    - "Оградить/инвалидировать только кэш новой версии источника; не стирать рабочую историю."
    - "При необходимости вернуть предыдущий совместимый release после безопасного drain."
    - "Клиентские данные после выкатки сохранить; старый backup не применять поверх текущих jobs/quota."
    - "Описать инцидент, reproducer и новый regression case до повторного включения."

