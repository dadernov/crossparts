test_matrix:
  - {id: QA01, layer: content, scenario: 'Unknown fields/private customer fields in snapshot', expected: 'Validator rejects; nothing published.'}
  - {id: QA02, layer: content, scenario: 'Unconfirmed group/brand, circular evidence, absent source/date, duplicate identity', expected: 'Not eligible for number publication.'}
  - {id: QA03, layer: content, scenario: 'Leading zeros, aliases, mixed-case and hyphens', expected: 'Number preserved; only reviewed aliases resolve; brand collisions excluded.'}
  - {id: QA04, layer: content, scenario: 'Clock fixed at 6/8/31 days and failed refresh', expected: 'Fresh/aging/stale policies applied; fetched_at unchanged by failure.'}
  - {id: QA05, layer: http, scenario: 'GET category/number with JS off, anonymous and signed-in', expected: 'Same public useful body, one H1, table, sources, working links, no private data.'}
  - {id: QA06, layer: http, scenario: 'Monkeypatch aggregator and reserve_queries to fail if called during public GET', expected: 'SEO, robots, sitemap and aliases still succeed without calls.'}
  - {id: QA07, layer: http, scenario: 'Unknown, draft, archived, stale and alias URL', expected: 'Status/canonical/indexability match matrix; no soft 404/redirect loops.'}
  - {id: QA08, layer: http, scenario: 'Sitemap after publish/unpublish and clock advance', expected: 'Exactly eligible canonical URLs; correct lastmod; no query/login/export entries.'}
  - {id: QA09, layer: security, scenario: 'XSS in fields and JSON-LD, hostile next/Host/source URL', expected: 'Escaped output, fixed origin, no external redirects or unsafe href.'}
  - {id: QA10, layer: integration, scenario: 'Prefill → Find without trial', expected: 'Access menu opens, number/group preserved, no API search and no quota change.'}
  - {id: QA11, layer: integration, scenario: 'Prefill → trial POST → reload → explicit Find', expected: 'Prefill survives; only explicit Find makes one request/one reservation.'}
  - {id: QA12, layer: integration, scenario: 'Prefill → failed login → successful login', expected: 'Intent survives both, password never echoed; account auth and autocomplete unchanged.'}
  - {id: QA13, layer: browser, scenario: 'Delayed/failed/retried loadGroups; edit OE/group before opening login', expected: 'Latest user values retained and correct group submitted.'}
  - {id: QA14, layer: browser, scenario: 'Excel CTA before and after login, invalid upload, correct upload', expected: 'Focus upload, file picked explicitly, existing quota and validation apply.'}
  - {id: QA15, layer: browser, scenario: 'Back, reload, two tabs, SEO example click', expected: 'No automatic search or duplicate quota charge.'}
  - {id: QA16, layer: browser, scenario: '320/390/768/1440/1920 viewport; Chromium and WebKit; keyboard', expected: 'No page overflow, visible focus, readable table, usable header/forms and stable mobile background.'}
  - {id: QA17, layer: analytics, scenario: 'Success/error events, reload, adblock, disabled provider', expected: 'Only permitted fields, no duplicate success events, workflow unaffected.'}
  - {id: QA18, layer: regression, scenario: 'Existing authenticated/guest search, history, pagination and XLSX/CSV/JSON exports', expected: 'Existing tests pass, empty sections remain hidden before first search.'}
  - {id: QA19, layer: release, scenario: 'SEO flags off and back on; old /categories route', expected: 'Old route preserved when off; no duplicate handlers; no broken root.'}
  - {id: QA20, layer: release, scenario: 'Smoke public domain after deploy', expected: 'Correct HTML/links/headers, health OK, no browser errors; no real customer search used.'}

release_gates:
  - {id: G01, required: true, condition: 'Актуальное поручение на реализацию/выпуск и понятные границы scope; изменения уже подготовлены для просмотра.'}
  - {id: G02, required: true, condition: 'Для каждой публикуемой страницы пройдены проверка данных и review, нет неподтверждённых фактов; неизвестный спрос явно отмечен.'}
  - {id: G03, required: true, condition: 'QA01–QA20 пройдены по применимым этапам, необходимые внешние действия явно отделены от локальной проверки.'}
  - {id: G04, required: true, condition: 'Есть предыдущий commit/config и точные шаги отката, БД клиентов не мигрирует.'}
  - {id: G05, required_for_measurement: true, condition: 'IN03 доступен для измеримого SEO-эксперимента; иначе запуск сайта и запуск наблюдения имеют разный статус.'}
release_sequence:
  - 'Локальный preview с CP_SEO_ENABLED=true и тестовыми/одобренными данными, без изменения production.'
  - 'Качественные категории можно выпустить раньше карточек, если T06 блокируется данными; оформить partial scope и выполнить применимые QA/Gates.'
  - 'Зафиксировать production revision и только нужные переменные окружения без секретов в отчёте.'
  - 'Деплой кода сначала с SEO flags off, smoke / и текущего /categories.'
  - 'Включить CP_SEO_ENABLED для хаба/категорий, CP_SEO_NUMBER_PAGES_ENABLED только для reviewed pilot cards.'
  - 'Перезапустить crossparts.service в рамках поручения на выпуск, проверить health, серверный HTML и браузер.'
  - 'Выполнить T13 при доступах; обычный GET не проверяет фактическую индексацию поисковиком.'
rollback:
  immediate_trigger: 'Регрессия поиска/входа, публикация приватных/ошибочных данных, 5xx, повреждение навигации или неконтролируемые вызовы каталогов.'
  steps:
    - 'Для дефектных карточек отключить number flag либо отозвать конкретные страницы; удалить их из sitemap и внутренних ссылок.'
    - 'Для общего дефекта отключить SEO flag, восстановить прежний /categories и навигацию; при проблеме интеграции откатить release commit.'
    - 'Восстановить изменённые настройки из сохранённой версии, перезапустить только нужный сервис и повторить smoke.'
    - 'Не откатывать рабочую БД и не сбрасывать квоты/историю аккаунтов.'
    - 'Для уже индексированных ошибочных URL отдельно управлять удалением/noindex/410 согласно типу отзыва; не считать выключение флага мгновенным удалением из поиска.'

observation_protocol:
  proposed_checkpoints_days: [14, 28, 56]
  timing_note: '6–8 недель — первое окно оценки пилота, а не обещанный срок SEO-эффекта.'
  metrics:
    - {id: M01, name: index_coverage, formula: 'indexed_canonical_pilot_urls / eligible_published_pilot_urls', source: search_consoles}
    - {id: M02, name: organic_ctr, formula: 'organic_clicks / organic_impressions', source: search_consoles}
    - {id: M03, name: workspace_transition, formula: 'sessions_with_seo_workspace_click / organic_landing_sessions', source: analytics}
    - {id: M04, name: trial_conversion, formula: 'attributed_sessions_with_trial_activated / organic_landing_sessions', source: analytics}
    - {id: M05, name: meaningful_usage, formula: 'attributed_sessions_with_search_completed_or_excel_job_created / organic_landing_sessions', source: analytics}
    - {id: M06, name: contact_intent, formula: 'attributed_sessions_with_support_click / organic_landing_sessions', source: analytics}
    - {id: M07, name: qualified_leads, formula: 'Ручная оценка подтверждённых B2B-обращений; клик по контакту не равен лиду или оплате.', source: sales_feedback}
  segmentation: [page_type, category, search_engine, device, brand_vs_nonbrand_query]
  zero_denominator: 'null/not_enough_data, не 0% и не вывод об эффективности.'
  decisions:
    expand: 'Есть индексируемые страницы, релевантные переходы и подтверждённое использование/качественные лиды. Предложить следующую небольшую партию; согласовать scope.'
    improve_indexing: 'URL не попадают в индекс — проверить доступность, дубли, контент и спрос до генерации новых.'
    improve_conversion: 'Переходы есть, запуска поиска нет — проверить намерение аудитории, CTA, авторизацию и качество ответа.'
    insufficient_sample: 'Мало данных — продолжить наблюдение; не объявлять победу/провал по нескольким визитам.'
    stop_expansion: 'Ошибки соответствий, массовое исключение малоценных страниц или ухудшение работы основного сервиса.'

risks:
  - {id: R01, risk: 'Ошибочный аналог на публичной карточке', mitigation: 'Прямые доказательства и review; исключение circular/ambiguous, дата и отзыв записи.'}
  - {id: R02, risk: 'Дубли и малоценные страницы', mitigation: 'Один URL на intent/entity, allowlist, самостоятельный ответ, небольшой пилот.'}
  - {id: R03, risk: 'Устаревшие или недоступные источники', mitigation: 'Снимки и дата; freshness policy, отсутствие live lookup на GET.'}
  - {id: R04, risk: 'Расход квоты/потеря номера через авторизацию', mitigation: 'Явный запуск, валидированный intent, браузерные/серверные тесты.'}
  - {id: R05, risk: 'Утечка данных клиентов из кэша/истории', mitigation: 'Allowlist сериализации, не читать jobs/accounts для публикации, ручной review артефакта.'}
  - {id: R06, risk: 'Трафик частных покупателей вместо B2B-клиентов', mitigation: 'Раздельные метрики категории/артикула и квалификация лидов селзом.'}
  - {id: R07, risk: 'Лишняя нагрузка от ботов', mitigation: 'Локальный SSR, bounded payload/cache, нет произвольной генерации URL/каталожных запросов.'}
  - {id: R08, risk: 'Неполная внешняя аналитика', mitigation: 'Явный blocked_external по IN03, no-op adapter, не выдавать setup за завершённый.'}

references:
  - id: REF01
    url: 'https://developers.google.com/search/docs/fundamentals/using-gen-ai-content'
    verified_at: '2026-09-22'
    takeaway: 'AI допустим как инструмент; массовые страницы без дополнительной пользы могут нарушать правила. Проверять точность текста и метаданных.'
  - id: REF02
    url: 'https://yandex.ru/support/webmaster/en/site-indexing/low-demand'
    verified_at: '2026-09-22'
    takeaway: 'Пустые, дублирующиеся и не соответствующие спросу страницы могут исключаться; важное содержание должно быть видно роботу.'
  - id: REF03
    url: 'https://developers.google.com/search/docs/crawling-indexing/consolidate-duplicate-urls'
    verified_at: '2026-09-22'
    takeaway: 'Согласовать канонические ссылки, редиректы и sitemap для вариантов одного документа.'
reference_recheck_policy: 'Перед реализацией перепроверить официальные требования, если они изменились; ни один срок/метрика плана не является гарантией ранжирования.'

verification_commands:
  usage: 'Команды для будущей реализации. Запускать в изолированном worktree, не в рабочем процессе production.'
  existing_offline_suite: 'env -u CP_LIVE python3 -m pytest tests -q'
  future_manifest_validation: 'python3 scripts/validate_seo.py'
  future_seo_suite: 'env -u CP_LIVE python3 -m pytest tests/test_seo_content.py tests/test_seo_routes.py tests/test_seo_journey.py -q'
  existing_regressions: 'env -u CP_LIVE python3 -m pytest tests/test_frontend.py tests/test_login.py tests/test_marketing.py tests/test_guest_quota.py -q'
  repository_check: 'git diff --check'
  live_readonly_health: 'curl -fsS https://mrb-crossparts.ru/healthz'
  outputs_policy: 'Скриншоты тестов сохранять во временный каталог; если существующие тесты пишут в output/, удалить только артефакты конкретного запуска, не чужие файлы.'

completion:
  implementation_done_when: 'T01–T12 выполнены для согласованного pilot scope; отдельные blocked_external/deferred явно отражены, не объявлены завершёнными.'
  experiment_done_when: 'T13–T14 имеют фактические данные и решение по следующему scope; ожидание индексации не блокирует сдачу технической реализации.'
  required_handoff: [release_commit, published_urls, test_report, missing_external_inputs, data_review_report, rollback_instructions, next_measurement_date]
  final_report_style: 'Кратко: что опубликовано, что проверено, что ждёт данных/доступов; без обещаний трафика.'
