# Строгий лимит нужен только на запросы, которые реально идут во внешние каталоги,
# то есть на POST. Пустой ключ => nginx не считает запрос, поэтому GET-опрос
# статуса задания из UI под лимит не попадает.
map $request_method $cp_write_key {
    POST    $binary_remote_addr;
    default "";
}

limit_req_zone $cp_write_key      zone=cp_scrape:10m  rate=30r/m;
limit_req_zone $binary_remote_addr zone=cp_general:10m rate=240r/m;
limit_conn_zone $binary_remote_addr zone=cp_conn:10m;
limit_req_status 429;
limit_conn_status 429;
