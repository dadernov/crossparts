server {
    server_name mrb-crossparts.ru www.mrb-crossparts.ru;

    client_max_body_size 20m;
    limit_conn cp_conn 20;

    access_log /var/log/nginx/crossparts.access.log;
    error_log  /var/log/nginx/crossparts.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Reviewed static SEO pages. Keep this allowlist in sync with seo/content.json.
    location = /categories/ { return 301 /categories; }
    location = /categories/brake-pads/ { return 301 /categories/brake-pads; }
    location = /categories/brake-discs/ { return 301 /categories/brake-discs; }
    location = /categories/brake-hoses/ { return 301 /categories/brake-hoses; }
    location = /categories/shock-absorbers/ { return 301 /categories/shock-absorbers; }
    location = /categories/radiators/ { return 301 /categories/radiators; }
    location = /cross/58101-h5a25/ { return 301 /cross/58101-h5a25; }
    location = /cross/1k0615301aa/ { return 301 /cross/1k0615301aa; }
    location = /cross/1k0611701k/ { return 301 /cross/1k0611701k; }
    location = /cross/553101g210/ { return 301 /cross/553101g210; }
    location = /cross/8200735038/ { return 301 /cross/8200735038; }
    location = /cross/58101H5A25 { return 301 /cross/58101-h5a25; }
    location = /cross/58101-H5A25 { return 301 /cross/58101-h5a25; }
    location = /cross/1K0611701K { return 301 /cross/1k0611701k; }
    location = /cross/553101G210 { return 301 /cross/553101g210; }
    location = /cross/1K0615301AA { return 301 /cross/1k0615301aa; }
    location = /cross/128424899 { return 410; }
    location = /cross/128424899/ { return 410; }
    location = /cross/21903130000811 { return 410; }
    location = /cross/21903130000811/ { return 410; }

    location = /categories {
        alias /var/www/crossparts/seo/categories.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "public, max-age=300" always;
    }
    location = /categories/brake-pads {
        alias /var/www/crossparts/seo/brake-pads.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "public, max-age=300" always;
    }
    location = /categories/brake-discs {
        alias /var/www/crossparts/seo/brake-discs.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "public, max-age=300" always;
    }
    location = /categories/brake-hoses {
        alias /var/www/crossparts/seo/brake-hoses.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "public, max-age=300" always;
    }
    location = /categories/shock-absorbers {
        alias /var/www/crossparts/seo/shock-absorbers.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "public, max-age=300" always;
    }
    location = /categories/radiators {
        alias /var/www/crossparts/seo/radiators.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "public, max-age=300" always;
    }
    location = /cross/58101-h5a25 {
        alias /var/www/crossparts/seo/58101-h5a25.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "public, max-age=300" always;
    }
    location = /cross/1k0615301aa {
        alias /var/www/crossparts/seo/1k0615301aa.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "public, max-age=300" always;
    }
    location = /cross/1k0611701k {
        alias /var/www/crossparts/seo/1k0611701k.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "public, max-age=300" always;
    }
    location = /cross/553101g210 {
        alias /var/www/crossparts/seo/553101g210.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "public, max-age=300" always;
    }
    location = /cross/8200735038 {
        alias /var/www/crossparts/seo/8200735038.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "public, max-age=300" always;
    }
    location = /robots.txt {
        alias /var/www/crossparts/seo/robots.txt;
        default_type text/plain;
    }
    location = /sitemap.xml {
        alias /var/www/crossparts/seo/sitemap.xml;
        default_type application/xml;
    }
    location /seo-assets/ {
        alias /var/www/crossparts/seo/assets/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    location / {
        # cp_scrape срабатывает только на POST (см. map в conf.d/crossparts-limits.conf)
        limit_req zone=cp_scrape  burst=10 nodelay;
        limit_req zone=cp_general burst=120 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/crossparts-proxy.conf;
        proxy_read_timeout 300s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mrb-crossparts.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mrb-crossparts.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.mrb-crossparts.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = mrb-crossparts.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name mrb-crossparts.ru www.mrb-crossparts.ru;
    return 404; # managed by Certbot




}
