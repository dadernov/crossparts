<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>{% block title %}{% endblock %}</title>
  <meta name="description" content="{% block description %}{% endblock %}">
  <link rel="canonical" href="{% block canonical %}{% endblock %}">
  <link rel="icon" href="/seo-assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/seo-assets/seo.css?v=3">
  {% block head %}{% endblock %}
</head>
<body>
<a class="skip" href="#main">К содержимому</a>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="/" aria-label="CrossParts — поиск кросс-номеров">Cross<span>Parts</span></a>
    <nav aria-label="Основная навигация">
      <a href="/categories"{% if page == 'categories' %} aria-current="page"{% endif %}>Категории</a>
      <a href="/pricing">Цены</a>
      <a href="/contacts">Контакты</a>
    </nav>
    <div class="header-actions">
      <a class="login" href="/login">Войти</a>
      <form action="/trial" method="post"><button class="button primary" type="submit">Попробовать ↗</button></form>
    </div>
  </div>
</header>
<div class="backdrop" aria-hidden="true"><span>58101–H5A25</span><span>OE / OEM</span><span>1K0 615 301 AA</span></div>
{% block content %}{% endblock %}
<footer class="site-footer">
  <a class="brand" href="/">Cross<span>Parts</span></a>
  <span>Инструмент для профессионалов рынка автозапчастей · MRB</span>
  <a href="https://t.me/mrbdigital" target="_blank" rel="noopener noreferrer">Поддержка · @mrbdigital ↗</a>
</footer>
<script src="/seo-assets/seo.js?v=2" defer></script>
</body>
</html>
